<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Desa Sepinggan Gelik</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #075e54;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 90%;
            max-width: 380px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #075e54;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #064c44;
        }

        #error {
            color: #c62828;
            text-align: center;
            margin-top: 12px;
            min-height: 18px;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #075e54;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Admin Desa</h1>

    <div class="subtitle">
        Desa Sepinggan Gelik
    </div>

    <form onsubmit="login(event)">

        <label>Username</label>
        <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
        >

        <button type="submit">
            Masuk Dashboard
        </button>

        <div id="error"></div>

    </form>

    <div class="back">
        <a href="../index.html">
            ← Kembali ke Website
        </a>
    </div>

</div>

<script>

function login(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if (username === "admin" && password === "123456") {

        localStorage.setItem(
            "adminLogin",
            "true"
        );

        window.location.href =
            "dashboard.html";

    } else {

        document.getElementById("error").textContent =
            "Username atau password salah.";

    }

}

</script>

</body>
</html>
